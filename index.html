<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hit Him With A Stick</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; }
  #gw { width: 1200px; max-width: 100%; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
  #ns { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; gap: 1.2rem; min-height: 420px; background: #fff; }
  #sb, #rb {
    font-size: 13px; padding: 10px 28px; cursor: pointer; letter-spacing: 2px;
    border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; color: #222;
    font-family: monospace; transition: background 0.1s;
  }
  #sb:hover, #rb:hover { background: #e8e8e8; }
  canvas { display: block; width: 100%; image-rendering: pixelated; touch-action: none; }
  #gu { display: none; }
  #hud {
    display: flex; justify-content: space-between; padding: 8px 16px;
    font-size: 13px; letter-spacing: 1px; color: #888; background: #f8f8f8;
    border-bottom: 1px solid #ddd;
  }
  #hud span { color: #222; font-weight: 500; }
  #hint {
    text-align: center; padding: 6px; font-size: 11px; letter-spacing: 2px;
    color: #aaa; background: #f8f8f8; border-top: 1px solid #ddd;
  }
  #os {
    display: none; flex-direction: column; align-items: center; gap: 1rem;
    padding: 2.5rem; background: #fff; border-top: 1px solid #ddd;
  }
  #os h2 { font-size: 26px; font-weight: 500; letter-spacing: 3px; color: #222; }
  #fs { font-size: 52px; font-weight: 500; color: #222; }
  #os p { color: #888; font-size: 13px; }
  #name-input {
    font-size: 22px; letter-spacing: 3px; color: #222; min-height: 36px;
    border: none; border-bottom: 2px solid #aaa; padding: 4px 12px; width: 220px;
    text-align: center; text-transform: uppercase; background: transparent;
    font-family: monospace; outline: none; -webkit-user-select: text; user-select: text;
  }
  #name-input::placeholder { color: #ccc; font-size: 16px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="gw">
  <div id="ns">
    <canvas id="tc" width="340" height="155" style="width:340px;max-width:100%;image-rendering:pixelated;border-radius:8px;overflow:hidden;"></canvas>
    <input id="name-input" type="text" maxlength="10" placeholder="ENTER NAME" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="sb">START</button>
    <p style="font-size:11px;color:#aaa;margin-top:4px;">TAP → jump · HOLD → sprint · dodge boxes · get close → BONK!</p>
  </div>
  <div id="gu">
    <div id="hud">
      <div>SCORE: <span id="sv">0</span></div>
      <div id="cd" style="display:none">COMBO: <span id="cv">x1</span></div>
      <div>BEST: <span id="bv">0</span></div>
    </div>
    <canvas id="c" width="1200" height="340"></canvas>
    <div id="hint">TAP → jump · HOLD → sprint · dodge boxes to get close · BONK!</div>
    <div id="os">
      <h2>RESPAWNING...</h2>
      <p id="om"></p>
      <div id="fs">0</div>
      <button id="rb">RUN AGAIN</button>
    </div>
  </div>
</div>

<script>
const ns=document.getElementById('ns'),gu=document.getElementById('gu'),sb=document.getElementById('sb');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const tc=document.getElementById('tc'),tctx=tc.getContext('2d');
const nameInput=document.getElementById('name-input');
const sv=document.getElementById('sv'),cd=document.getElementById('cd'),cv=document.getElementById('cv'),bv=document.getElementById('bv');
const os=document.getElementById('os'),fsEl=document.getElementById('fs'),om=document.getElementById('om'),rb=document.getElementById('rb');

const W=1200,H=340,GROUND=H-60,SCREEN_CX=150,HIT_ZONE=90;
let animId,pName='VICTIM',best=0;
let score,combo,shakeT,bonkTexts,particles,floaties;
let runFrame,runTimer,hitReact,hitT,hitAnim;
let chaserSwing,chaserSwingT,gameRunning;
let titleFrame=0,titleTimer=0,onTitleScreen=true;

// World positions - both characters move right in world space
let cartmanX,runnerWorldX,cameraX;
let cartmanSpeed,runnerSpeed;

// Jump
let isJumping=false,jumpVY=0,jumpY=0;
const JUMP_POWER=-13,GRAVITY=0.65;

// Sprint (long press)
let sprintHeld=false;

// Runner AI
let runnerState,runnerStateTimer,runnerSpeedMult;
let runnerTaunting,runnerTauntMsg,runnerStumble;
let stumbleTimer;

// Obstacles (boxes thrown by runner) - world X positions
let boxes,boxTimer,boxInterval;

const FUNNY=[
  'OW!!','MY SPINE!','NOT THE FACE!','HELP!!!','MOM!!!',
  'WHY ME??','AAUGH!','OWWW!!','MY NECK!','STAAAHP!',
  'NO NO NO!','OH GOD','RESPECT MY AUTHORITAH!','SOMEBODY HELP!','NOT AGAIN!!'
];
const TAUNTS=['CAN\'T CATCH ME!','TOO SLOW!','HAHA!','NOPE!','CATCH THIS!','TAKE THAT!','EAT BOX!','LOL'];
const THROW_LINES=['TAKE THIS!','CATCH!','DODGE THIS!','INCOMING!','HAH!','EAT WOOD!'];

const C = {
  sky:'#c8e8f8', ground:'#c4a97a', gl:'#9a7850',
  txt:'#111111', muted:'#999999', bonk:'#e24b4a',
  miss:'#bbbbbb', rb:'#534AB7', cb:'#e24b4a',
  skin:'#f5c5a3', stick:'#333333',
  cloud:'rgba(255,255,255,0.88)', spbar:'#534AB7',
  star:'#f7c948', tear:'#5bbde4',
  box:'#b5651d', boxDark:'#8B4513', boxLight:'#d4915c'
};

// ─── Cartman ─────────────────────────────────────────────────────────────────
function drawCartmanOnCtx(c,x,y,scale,swing,angry){
  const s=v=>v*scale;
  c.fillStyle='#c0392b';
  c.beginPath();c.ellipse(x,y-s(14),s(22),s(20),0,0,Math.PI*2);c.fill();
  c.fillStyle='#222';
  for(let i=0;i<3;i++){c.beginPath();c.arc(x,y-s(22)+s(i*7),s(1.5),0,Math.PI*2);c.fill();}
  c.fillStyle='#f1c40f';
  c.beginPath();c.ellipse(x-s(20),y-s(14),s(7),s(5),-0.3,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(20),y-s(14),s(7),s(5),0.3,0,Math.PI*2);c.fill();
  c.fillStyle='#6d4c41';
  c.beginPath();c.ellipse(x-s(8),y,s(6),s(4),0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(8),y,s(6),s(4),0,0,Math.PI*2);c.fill();
  c.fillStyle='#f0c896';
  c.beginPath();c.arc(x,y-s(42),s(20),0,Math.PI*2);c.fill();
  c.fillStyle='rgba(220,120,100,0.3)';
  c.beginPath();c.ellipse(x-s(13),y-s(37),s(6),s(4),0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(13),y-s(37),s(6),s(4),0,0,Math.PI*2);c.fill();
  c.fillStyle='#ffffff';
  c.beginPath();c.ellipse(x-s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.fill();
  c.fillStyle='#111';
  if(angry){
    c.beginPath();c.arc(x-s(7),y-s(43),s(3),0,Math.PI*2);c.fill();
    c.beginPath();c.arc(x+s(7),y-s(43),s(3),0,Math.PI*2);c.fill();
    c.strokeStyle='#333';c.lineWidth=s(2);c.lineCap='round';
    c.beginPath();c.moveTo(x-s(13),y-s(51));c.lineTo(x-s(2),y-s(48));c.stroke();
    c.beginPath();c.moveTo(x+s(13),y-s(51));c.lineTo(x+s(2),y-s(48));c.stroke();
  } else {
    c.beginPath();c.arc(x-s(7),y-s(44),s(2.5),0,Math.PI*2);c.fill();
    c.beginPath();c.arc(x+s(7),y-s(44),s(2.5),0,Math.PI*2);c.fill();
  }
  c.strokeStyle='#888';c.lineWidth=s(0.8);
  c.beginPath();c.ellipse(x-s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.stroke();
  c.beginPath();c.ellipse(x+s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.stroke();
  c.strokeStyle='#555';c.lineWidth=s(1.5);c.lineCap='round';
  c.beginPath();c.arc(x,angry?y-s(32):y-s(34),s(5),0.1,Math.PI-0.1);c.stroke();
  c.strokeStyle='rgba(0,0,0,0.15)';c.lineWidth=s(1);
  c.beginPath();c.arc(x,y-s(36),s(10),0.3,Math.PI-0.3);c.stroke();
  c.fillStyle='#1abc9c';
  c.beginPath();c.arc(x,y-s(64),s(19),Math.PI,0);c.fill();
  c.fillRect(x-s(19),y-s(64),s(38),s(6));
  c.fillStyle='#f1c40f';
  c.fillRect(x-s(20),y-s(59),s(40),s(5));
  c.fillStyle='#f1c40f';
  c.beginPath();c.arc(x-s(2),y-s(82),s(5),0,Math.PI*2);c.fill();
  c.beginPath();c.arc(x+s(4),y-s(80),s(4),0,Math.PI*2);c.fill();
  c.beginPath();c.arc(x,y-s(79),s(4),0,Math.PI*2);c.fill();
  if(swing){
    c.strokeStyle=C.stick;c.lineWidth=s(4);c.lineCap='round';
    c.beginPath();c.moveTo(x+s(18),y-s(20));c.lineTo(x+s(52),y-s(60));c.stroke();
    c.fillStyle='#888';c.beginPath();c.arc(x+s(52),y-s(60),s(6),0,Math.PI*2);c.fill();
  }
}

// ─── Runner (target) ────────────────────────────────────────────────────────
function drawRunnerBody(x,y,frame,hitAn){
  const lo=frame===0?9:-9,ao=frame===0?7:-7;
  ctx.strokeStyle=C.rb;ctx.lineWidth=3;ctx.lineCap='round';
  if(hitAn===1){
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-8,y-44);ctx.lineTo(x+18,y-55);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-8,y-44);ctx.lineTo(x-18,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+18,y-8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-14,y+2);ctx.stroke();
  } else if(hitAn===2){
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+8,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+4,y-46);ctx.lineTo(x+22,y-38);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+4,y-46);ctx.lineTo(x-10,y-40);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-16,y-10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+20,y+2);ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-12,y-20+ao);ctx.lineTo(x+12,y-20-ao);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+lo,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-lo,y);ctx.stroke();
  }
  ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(x,y-58,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=C.rb;ctx.lineWidth=2;ctx.stroke();
  if(hitReact){
    ctx.fillStyle='#111';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText('X X',x,y-55);
  } else {
    ctx.fillStyle='#555';ctx.fillRect(x-5,y-61,4,3);ctx.fillRect(x+1,y-61,4,3);
  }
}

// ─── Box drawing ────────────────────────────────────────────────────────────
function drawBox(x,y,w,h){
  ctx.fillStyle=C.box;
  ctx.fillRect(x,y,w,h);
  ctx.fillStyle=C.boxDark;
  ctx.fillRect(x,y,w,3);
  ctx.fillRect(x,y,3,h);
  ctx.fillStyle=C.boxLight;
  ctx.fillRect(x+w-3,y,3,h);
  ctx.fillRect(x,y+h-3,w,3);
  // Wood grain
  ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=1;
  for(let i=1;i<3;i++){
    ctx.beginPath();ctx.moveTo(x+4,y+i*(h/3));ctx.lineTo(x+w-4,y+i*(h/3));ctx.stroke();
  }
  // Cross marks
  ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1.5;
  const cx=x+w/2,cy=y+h/2;
  ctx.beginPath();ctx.moveTo(cx-6,cy-6);ctx.lineTo(cx+6,cy+6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+6,cy-6);ctx.lineTo(cx-6,cy+6);ctx.stroke();
}

// ─── Title screen ───────────────────────────────────────────────────────────
function drawTitleScreen(){
  const tw=340,th=155;
  tctx.clearRect(0,0,tw,th);
  tctx.fillStyle=C.sky;tctx.fillRect(0,0,tw,th);
  tctx.fillStyle=C.ground;tctx.fillRect(0,th-28,tw,28);
  const rx2=235,cx2=105;
  const lo=titleFrame===0?7:-7,ao=titleFrame===0?5:-5;
  tctx.strokeStyle=C.rb;tctx.lineWidth=2.5;tctx.lineCap='round';
  tctx.beginPath();tctx.moveTo(rx2,th-28);tctx.lineTo(rx2+lo,th-28);tctx.stroke();
  tctx.beginPath();tctx.moveTo(rx2,th-28);tctx.lineTo(rx2-lo,th-28);tctx.stroke();
  tctx.beginPath();tctx.moveTo(rx2,th-28);tctx.lineTo(rx2,th-46);tctx.stroke();
  tctx.beginPath();tctx.moveTo(rx2-9,th-37+ao);tctx.lineTo(rx2+9,th-37-ao);tctx.stroke();
  tctx.fillStyle=C.skin;tctx.beginPath();tctx.arc(rx2,th-54,9,0,Math.PI*2);tctx.fill();
  tctx.strokeStyle=C.rb;tctx.lineWidth=2;tctx.stroke();
  tctx.fillStyle='#555';tctx.fillRect(rx2-4,th-57,3,2);tctx.fillRect(rx2+1,th-57,3,2);
  // Draw a box being thrown
  tctx.fillStyle=C.box;tctx.fillRect(160,th-50,20,20);
  tctx.fillStyle=C.boxDark;tctx.fillRect(160,th-50,20,2);
  drawCartmanOnCtx(tctx,cx2,th-28,0.55,true,true);
  tctx.font='bold 14px monospace';tctx.textAlign='center';tctx.fillStyle=C.bonk;
  tctx.fillText('HIT HIM WITH A STICK',170,18);
}

function animateTitleScreen(){
  titleTimer++;if(titleTimer>14){titleFrame=1-titleFrame;titleTimer=0;}
  drawTitleScreen();
  if(onTitleScreen)requestAnimationFrame(animateTitleScreen);
}

// ─── Game init ──────────────────────────────────────────────────────────────
function startGame(){
  onTitleScreen=false;
  pName=(nameInput.value.trim()||'VICTIM').toUpperCase();
  nameInput.blur();
  ns.style.display='none';gu.style.display='block';
  initGame();gameLoop();
}

function initGame(){
  score=0;combo=0;shakeT=0;
  bonkTexts=[];particles=[];floaties=[];
  runFrame=0;runTimer=0;hitReact=false;hitT=0;hitAnim=0;
  chaserSwing=false;chaserSwingT=0;gameRunning=true;
  isJumping=false;jumpVY=0;jumpY=0;sprintHeld=false;
  // World positions
  cartmanX=0;runnerWorldX=700;cameraX=0;
  cartmanSpeed=4;runnerSpeed=3;
  runnerState='normal';runnerStateTimer=60;runnerSpeedMult=1;
  runnerTaunting=false;runnerTauntMsg='';runnerStumble=false;stumbleTimer=0;
  boxes=[];boxTimer=0;boxInterval=90;
  sv.textContent='0';cd.style.display='none';os.style.display='none';
}

// ─── Jump ───────────────────────────────────────────────────────────────────
function triggerJump(){
  if(!isJumping&&gameRunning){
    isJumping=true;jumpVY=JUMP_POWER;
  }
}

// ─── Obstacle spawning ─────────────────────────────────────────────────────
function spawnBox(){
  const difficulty=Math.min(score*0.03,1);
  const r=Math.random();
  let bw,bh;
  if(r<0.5){bw=30;bh=30;}
  else if(r<0.8){bw=30;bh=50;}
  else {bw=50;bh=30;}

  const rsx=runnerWorldX-cameraX; // runner screen X for text
  bonkTexts.push({text:THROW_LINES[Math.floor(Math.random()*THROW_LINES.length)],x:rsx,y:GROUND-100,life:0.5,size:14,color:'#e67e22',wobble:false});

  boxes.push({
    wx:runnerWorldX-20, // world X
    y:GROUND-bh,
    w:bw,h:bh,
    vx:-(6+cartmanSpeed+difficulty*3), // travels left in world space
    active:true
  });
}

function checkBoxCollision(box){
  if(!box.active)return false;
  const chaserY=GROUND+jumpY;
  const cartScreenX=cartmanX-cameraX;
  const boxScreenX=box.wx-cameraX;
  return (cartScreenX+18)>(boxScreenX)&&(cartScreenX-18)<(boxScreenX+box.w)&&chaserY>(box.y)&&(chaserY-80)<(box.y+box.h);
}

// ─── Bonk (auto when close enough) ─────────────────────────────────────────
function doBoink(){
  const gap=runnerWorldX-cartmanX;
  const closeness=Math.max(0,Math.min(1,1-(gap-50)/(HIT_ZONE-50)));
  let pts=Math.ceil(closeness*5)+1;
  let bonkLabel='BONK!',bonkSize=28,bonkCol='#e24b4a';

  if(closeness>0.9){bonkLabel='PERFECT!!';bonkSize=42;bonkCol='#f7c948';}
  else if(closeness>0.6){bonkLabel='GREAT!';bonkSize=36;bonkCol='#1D9E75';}
  else if(closeness>0.3){bonkLabel='BONK!';bonkSize=30;bonkCol='#BA7517';}

  combo++;
  const comboMult=Math.min(combo,5);
  const totalPts=pts*(combo>=2?comboMult:1);
  score+=totalPts;

  const rsx=runnerWorldX-cameraX;
  bonkTexts.push({text:bonkLabel,x:rsx,y:GROUND-110,life:1,size:bonkSize,color:bonkCol});
  bonkTexts.push({text:'+'+totalPts,x:rsx,y:GROUND-130,life:1,size:20,color:'#fff'});
  if(combo>=2)bonkTexts.push({text:'x'+comboMult+' COMBO',x:rsx-40,y:GROUND-90,life:0.7,size:14,color:'#1D9E75'});
  const cry=FUNNY[Math.floor(Math.random()*FUNNY.length)];
  bonkTexts.push({text:cry,x:rsx+20,y:GROUND-145,life:1,size:16,color:'#e24b4a',wobble:true});

  spawnParticles(rsx,GROUND-50);spawnFloaties(rsx,GROUND-70);
  hitReact=true;hitT=38;hitAnim=(hitAnim+1)%4;
  chaserSwing=true;chaserSwingT=24;shakeT=closeness>0.8?18:12;
  sv.textContent=score;
  if(combo>=2){cd.style.display='block';cv.textContent='x'+comboMult;}
  if(score>best){best=score;bv.textContent=best;}

  // After bonk: runner sprints away
  runnerWorldX=cartmanX+600+Math.random()*150;
  cartmanSpeed=Math.min(cartmanSpeed+0.15,8);
  runnerSpeed=cartmanSpeed*0.75; // runner base always slower than Cartman
  boxInterval=Math.max(35,boxInterval-3);
  runnerState='normal';runnerStateTimer=40;
  runnerTaunting=false;runnerStumble=false;
}

function onBoxHit(){
  combo=0;cd.style.display='none';
  // Cartman slows down, runner pulls ahead
  stumbleTimer=30;
  shakeT=8;
  const csx=cartmanX-cameraX;
  bonkTexts.push({text:'OUCH!',x:csx,y:GROUND-100+jumpY,life:0.7,size:22,color:'#e24b4a'});
  bonkTexts.push({text:'*stumbles*',x:csx+20,y:GROUND-75+jumpY,life:0.5,size:14,color:C.miss});
}

// ─── Effects ────────────────────────────────────────────────────────────────
function spawnParticles(x,y){
  for(let i=0;i<14;i++)
    particles.push({x,y,vx:(Math.random()-0.5)*11,vy:-Math.random()*8-2,life:1,size:Math.random()*6+2,col:Math.random()<0.5?'#e24b4a':'#f7c948'});
}
function spawnFloaties(x,y){
  const em=['★','★','💧','💧','💫','✦','~','~'];
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    floaties.push({x,y:y-10,vx:Math.cos(a)*4+(Math.random()-0.5)*3,vy:Math.sin(a)*4-3,life:1,char:em[i],size:14+Math.random()*8,rot:Math.random()*6});
  }
}

function drawBg(){
  ctx.fillStyle=C.sky;ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle=C.cloud;
  for(let i=0;i<6;i++){
    const cx2=((i*240-cameraX*0.15)%(W+200)+W+200)%(W+200)-100,cy=32+(i%2)*26;
    ctx.beginPath();ctx.ellipse(cx2,cy,38,16,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx2-22,cy+6,26,13,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx2+22,cy+6,26,13,0,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=C.ground;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle=C.gl;ctx.lineWidth=1;
  for(let i=0;i<30;i++){
    const lx=((i*75-cameraX*1.2)%W+W)%W;
    ctx.beginPath();ctx.moveTo(lx,GROUND);ctx.lineTo(lx-18,H);ctx.stroke();
  }
}

function drawGapBar(){
  const bW=200,bH=10,bx=W/2-100,by=14;
  const gap=runnerWorldX-cartmanX;
  const maxGap=850,pct=Math.max(0,Math.min(1,1-gap/maxGap));
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.beginPath();ctx.roundRect(bx,by,bW,bH,5);ctx.fill();
  const inRange=gap<=HIT_ZONE;
  ctx.fillStyle=inRange?C.bonk:C.spbar;
  ctx.beginPath();ctx.roundRect(bx,by,bW*pct,bH,5);ctx.fill();
  ctx.font='9px monospace';ctx.textAlign='center';
  ctx.fillStyle=inRange?C.bonk:C.muted;
  const label=inRange?'BONK RANGE!':(sprintHeld?'SPRINTING!':'CLOSING IN...');
  ctx.fillText(label,W/2,by+bH+13);
}

function updateParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.life-=0.045;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.size,p.size);
  });
  ctx.globalAlpha=1;
}
function updateFloaties(){
  floaties=floaties.filter(f=>f.life>0);
  floaties.forEach(f=>{
    f.x+=f.vx;f.y+=f.vy;f.vy+=0.15;f.life-=0.03;f.rot+=0.1;
    ctx.globalAlpha=f.life;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
    ctx.font=`${f.size}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=f.char==='★'||f.char==='✦'?C.star:C.tear;
    ctx.fillText(f.char,0,0);ctx.restore();
  });
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
}
function updateBonkTexts(){
  bonkTexts=bonkTexts.filter(b=>b.life>0);
  bonkTexts.forEach(b=>{
    b.y-=1.8;b.life-=0.022;
    ctx.globalAlpha=b.life;
    const wx=b.wobble?Math.sin(b.life*30)*3:0;
    ctx.font=`bold ${b.size}px monospace`;ctx.textAlign='center';
    ctx.fillStyle=b.color;ctx.fillText(b.text,b.x+wx,b.y);
  });
  ctx.globalAlpha=1;
}

// ─── Runner AI ──────────────────────────────────────────────────────────────
function updateRunnerAI(){
  const difficulty=Math.min(score*0.03,1);
  const gap=runnerWorldX-cartmanX;
  const rsx=runnerWorldX-cameraX;
  runnerStateTimer--;
  if(runnerStateTimer<=0){
    const r=Math.random();
    if(gap<200){
      runnerState='panic';runnerStateTimer=40+Math.floor(Math.random()*30);
      runnerSpeedMult=1.4+difficulty*0.5;
      bonkTexts.push({text:'?!',x:rsx,y:GROUND-105,life:0.5,size:22,color:'#e24b4a'});
    } else if(gap>400){
      if(r<0.4){
        runnerState='taunt';runnerStateTimer=60+Math.floor(Math.random()*40);
        runnerTaunting=true;runnerSpeedMult=0.3;
        runnerTauntMsg=TAUNTS[Math.floor(Math.random()*TAUNTS.length)];
        bonkTexts.push({text:runnerTauntMsg,x:rsx,y:GROUND-105,life:0.8,size:16,color:'#3498db',wobble:true});
      } else if(r<0.55){
        runnerState='stumble';runnerStateTimer=35+Math.floor(Math.random()*20);
        runnerStumble=true;runnerSpeedMult=0;
        bonkTexts.push({text:'*trips*',x:rsx,y:GROUND-90,life:0.6,size:16,color:'#e67e22'});
      } else {
        runnerState='normal';runnerStateTimer=30+Math.floor(Math.random()*30);
        runnerSpeedMult=0.6+Math.random()*0.4;
      }
    } else {
      runnerState='normal';runnerStateTimer=25+Math.floor(Math.random()*30);
      runnerSpeedMult=0.6+Math.random()*0.5;
    }
  }
  if(runnerStateTimer<=3){runnerTaunting=false;runnerStumble=false;}
}

// ─── Game loop ──────────────────────────────────────────────────────────────
function gameLoop(){
  if(!gameRunning)return;

  // Move both characters in world space
  // Cartman: base speed + sprint bonus, slowed when stumbling
  let cartVel=cartmanSpeed;
  if(stumbleTimer>0)cartVel=cartmanSpeed*0.3;
  else if(sprintHeld)cartVel=cartmanSpeed*2.5;
  cartmanX+=cartVel;

  // Runner AI
  updateRunnerAI();
  const runnerVel=runnerSpeed*runnerSpeedMult;
  runnerWorldX+=runnerVel;

  // Camera follows Cartman (Cartman stays at SCREEN_CX)
  cameraX=cartmanX-SCREEN_CX;

  // Stumble recovery
  if(stumbleTimer>0)stumbleTimer--;

  // Jump physics
  if(isJumping){
    jumpY+=jumpVY;jumpVY+=GRAVITY;
    if(jumpY>=0){jumpY=0;jumpVY=0;isJumping=false;}
  }

  // Box spawning
  boxTimer++;
  if(boxTimer>=boxInterval){
    boxTimer=0;
    spawnBox();
  }

  // Update boxes (move in world space)
  boxes.forEach(b=>{
    b.wx+=b.vx;
    if(b.active&&checkBoxCollision(b)){
      b.active=false;
      onBoxHit();
    }
  });
  // Remove boxes far behind camera
  boxes=boxes.filter(b=>(b.wx-cameraX)+b.w>-100);

  // Auto-bonk when in range
  const gap=runnerWorldX-cartmanX;
  if(gap<=HIT_ZONE&&!hitReact){
    doBoink();
  }

  // Animation
  runTimer++;
  const animSpd=runnerStumble?30:(runnerTaunting?20:8);
  if(runTimer>animSpd){runFrame=1-runFrame;runTimer=0;}
  if(hitT>0)hitT--;if(hitT===0){hitReact=false;}
  if(chaserSwingT>0)chaserSwingT--;if(chaserSwingT===0)chaserSwing=false;
  if(shakeT>0)shakeT--;

  // ─── Draw ───────────────────────────────────────────────────────────────
  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*5);
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawGapBar();
  updateParticles();updateFloaties();

  // Draw boxes (world to screen)
  boxes.forEach(b=>{
    const bsx=b.wx-cameraX;
    if(bsx>-60&&bsx<W+60){
      if(b.active)drawBox(bsx,b.y,b.w,b.h);
      else {
        ctx.globalAlpha=0.4;
        drawBox(bsx,b.y+5,b.w*0.6,b.h*0.6);
        ctx.globalAlpha=1;
      }
    }
  });

  // Draw runner (world to screen)
  const rsx=runnerWorldX-cameraX;
  const ry=GROUND;
  if(rsx>-50&&rsx<W+50){
    ctx.font='bold 13px monospace';ctx.textAlign='center';
    ctx.fillStyle=hitReact?C.bonk:(runnerTaunting?'#3498db':(runnerStumble?'#e67e22':C.txt));
    ctx.fillText(pName.toUpperCase(),rsx,ry-88);

    if(runnerStumble){
      ctx.strokeStyle=C.rb;ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(rsx-5,ry);ctx.lineTo(rsx+15,ry-25);ctx.stroke();
      ctx.beginPath();ctx.moveTo(rsx+10,ry-18);ctx.lineTo(rsx+25,ry-10);ctx.stroke();
      ctx.beginPath();ctx.moveTo(rsx+10,ry-18);ctx.lineTo(rsx-5,ry-25);ctx.stroke();
      ctx.beginPath();ctx.moveTo(rsx-5,ry);ctx.lineTo(rsx-12,ry+2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(rsx-5,ry);ctx.lineTo(rsx+8,ry+2);ctx.stroke();
      ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(rsx+18,ry-32,9,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=C.rb;ctx.lineWidth=2;ctx.stroke();
    } else if(runnerTaunting){
      drawRunnerBody(rsx,ry,runFrame,0);
      ctx.fillStyle='#555';
      ctx.fillRect(rsx-7,ry-61,4,3);ctx.fillRect(rsx-2,ry-61,4,3);
    } else {
      drawRunnerBody(rsx,ry,runFrame,hitReact?hitAnim:0);
    }
  } else if(rsx>=W+50){
    ctx.font='bold 12px monospace';ctx.textAlign='right';
    ctx.fillStyle=C.bonk;
    ctx.fillText(pName+' \u2192',W-10,30);
  }

  // Draw Cartman at fixed screen position
  const cartScreenX=cartmanX-cameraX; // should equal SCREEN_CX
  const chaserY=GROUND+jumpY;
  drawCartmanOnCtx(ctx,cartScreenX,chaserY,1,chaserSwing,chaserSwing);

  // Jump shadow
  if(isJumping){
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath();ctx.ellipse(cartScreenX,GROUND+2,22,6,0,0,Math.PI*2);ctx.fill();
  }

  // Stumble indicator
  if(stumbleTimer>0){
    ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillStyle='rgba(226,75,74,0.6)';
    ctx.fillText('STUNNED',cartScreenX,GROUND+20);
  }

  // Sprint indicator
  if(sprintHeld&&stumbleTimer<=0&&!isJumping){
    ctx.font='bold 11px monospace';ctx.textAlign='center';
    ctx.fillStyle='#534AB7';
    ctx.fillText('SPRINT!',cartScreenX,GROUND+20);
    ctx.strokeStyle='rgba(83,74,183,0.4)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const ly=GROUND-20-i*20+jumpY;
      ctx.beginPath();ctx.moveTo(cartScreenX-30-i*8,ly);ctx.lineTo(cartScreenX-50-i*8,ly);ctx.stroke();
    }
  }

  updateBonkTexts();ctx.restore();
  animId=requestAnimationFrame(gameLoop);
}

// ─── Controls ───────────────────────────────────────────────────────────────
// Short press = jump, long hold = sprint
document.addEventListener('keydown',e=>{
  if(onTitleScreen){
    if(e.key==='Enter')startGame();
    return;
  }
  if(e.code==='Space'){
    e.preventDefault();
    if(!sprintHeld){triggerJump();sprintHeld=true;}
  }
  if(e.code==='Enter'&&!gameRunning)rb.click();
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space')sprintHeld=false;
});

canvas.addEventListener('mousedown',()=>{if(!onTitleScreen){triggerJump();sprintHeld=true;}});
canvas.addEventListener('mouseup',()=>{sprintHeld=false;});

document.addEventListener('touchstart',e=>{
  if(onTitleScreen)return;
  if(!gameRunning){rb.click();e.preventDefault();return;}
  e.preventDefault();triggerJump();sprintHeld=true;
},{passive:false});
document.addEventListener('touchend',e=>{
  if(onTitleScreen)return;
  e.preventDefault();sprintHeld=false;
},{passive:false});

sb.addEventListener('click',startGame);
rb.addEventListener('click',()=>{gameRunning=false;initGame();gameLoop();});

animateTitleScreen();
</script>
