<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hit Him With A Stick</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  body { background: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: monospace; }
  #gw { width: 700px; max-width: 100%; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
  #ns { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; gap: 1.2rem; min-height: 500px; background: #fff; }
  #sb, #rb {
    font-size: 13px; padding: 10px 28px; cursor: pointer; letter-spacing: 2px;
    border-radius: 8px; border: 1px solid #ccc; background: #f5f5f5; color: #222;
    font-family: monospace; transition: background 0.1s;
  }
  #sb:hover, #rb:hover { background: #e8e8e8; }
  canvas { display: block; width: 100%; image-rendering: pixelated; touch-action: none; }
  #gu { display: none; }
  #hud {
    display: flex; justify-content: space-between; padding: 8px 16px;
    font-size: 13px; letter-spacing: 1px; color: #888; background: #f8f8f8;
    border-bottom: 1px solid #ddd;
  }
  #hud span { color: #222; font-weight: 500; }
  #hint {
    text-align: center; padding: 6px; font-size: 11px; letter-spacing: 2px;
    color: #aaa; background: #f8f8f8; border-top: 1px solid #ddd;
  }
  #os {
    display: none; flex-direction: column; align-items: center; gap: 1rem;
    padding: 2.5rem; background: #fff; border-top: 1px solid #ddd;
  }
  #os h2 { font-size: 26px; font-weight: 500; letter-spacing: 3px; color: #222; }
  #fs { font-size: 52px; font-weight: 500; color: #222; }
  #os p { color: #888; font-size: 13px; }
  #name-input {
    font-size: 22px; letter-spacing: 3px; color: #222; min-height: 36px;
    border: none; border-bottom: 2px solid #aaa; padding: 4px 12px; width: 220px;
    text-align: center; text-transform: uppercase; background: transparent;
    font-family: monospace; outline: none; -webkit-user-select: text; user-select: text;
  }
  #name-input::placeholder { color: #ccc; font-size: 16px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="gw">
  <div id="ns">
    <canvas id="tc" width="340" height="155" style="width:340px;max-width:100%;image-rendering:pixelated;border-radius:8px;overflow:hidden;"></canvas>
    <input id="name-input" type="text" maxlength="10" placeholder="ENTER NAME" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="sb">START</button>
    <p style="font-size:11px;color:#aaa;margin-top:4px;">HOLD → sprint · RELEASE → BONK · DOUBLE-TAP → JUMP BONK!</p>
  </div>
  <div id="gu">
    <div id="hud">
      <div>SCORE: <span id="sv">0</span></div>
      <div id="cd" style="display:none">COMBO: <span id="cv">x1</span></div>
      <div>BEST: <span id="bv">0</span></div>
    </div>
    <canvas id="c" width="700" height="310"></canvas>
    <div id="hint">HOLD → sprint · RELEASE → BONK · DOUBLE-TAP → JUMP BONK!</div>
    <div id="os">
      <h2>RESPAWNING...</h2>
      <p id="om"></p>
      <div id="fs">0</div>
      <button id="rb">RUN AGAIN</button>
    </div>
  </div>
</div>

<script>
const ns=document.getElementById('ns'),gu=document.getElementById('gu'),sb=document.getElementById('sb');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const tc=document.getElementById('tc'),tctx=tc.getContext('2d');
const nameInput=document.getElementById('name-input');
const sv=document.getElementById('sv'),cd=document.getElementById('cd'),cv=document.getElementById('cv'),bv=document.getElementById('bv');
const os=document.getElementById('os'),fs=document.getElementById('fs'),om=document.getElementById('om'),rb=document.getElementById('rb');

const W=700,H=310,GROUND=H-60,RX=510,MIN_GAP=42,HIT_ZONE=85;
let animId,pName='VICTIM',best=0;
let score,combo,bgX,spd,shakeT,bonkTexts,particles,floaties;
let runFrame,runTimer,hitReact,hitT,hitAnim;
let chaserSwing,chaserSwingT,gameRunning,gap,chaserX;
let spaceHeld=false,touchHeld=false;
let titleFrame=0,titleTimer=0,onTitleScreen=true;

// Jump state
let isJumping=false,jumpVY=0,jumpY=0;
const JUMP_POWER=-12,GRAVITY=0.7;
let lastTapTime=0;
const DOUBLE_TAP_MS=300;

// Runner (target) AI state
let runnerBaseX=RX;
let runnerState='normal'; // 'normal','panic','taunt','duck','stumble'
let runnerStateTimer=0;
let runnerSpeedMult=1; // speed multiplier for variable speed
let runnerDucking=false,runnerDuckTimer=0;
let runnerTaunting=false,runnerTauntMsg='';
let runnerStumble=false;

const FUNNY=[
  'OW!!','MY SPINE!','NOT THE FACE!','HELP!!!','MOM!!!',
  'WHY ME??','AAUGH!','OWWW!!','MY NECK!','STAAAHP!',
  'NO NO NO!','OH GOD','RESPECT MY AUTHORITAH!','SOMEBODY HELP!','NOT AGAIN!!'
];

const C = {
  sky:'#c8e8f8', ground:'#c4a97a', gl:'#9a7850',
  txt:'#111111', muted:'#999999', bonk:'#e24b4a',
  miss:'#bbbbbb', rb:'#534AB7', cb:'#e24b4a',
  skin:'#f5c5a3', stick:'#333333',
  cloud:'rgba(255,255,255,0.88)', spbar:'#534AB7',
  star:'#f7c948', tear:'#5bbde4',
  star2:'rgba(0,0,0,0)'
};

// ─── Cartman ─────────────────────────────────────────────────────────────────
function drawCartmanOnCtx(c,x,y,scale,swing,angry){
  const s=v=>v*scale;
  c.fillStyle='#c0392b';
  c.beginPath();c.ellipse(x,y-s(14),s(22),s(20),0,0,Math.PI*2);c.fill();
  c.fillStyle='#222';
  for(let i=0;i<3;i++){c.beginPath();c.arc(x,y-s(22)+s(i*7),s(1.5),0,Math.PI*2);c.fill();}
  c.fillStyle='#f1c40f';
  c.beginPath();c.ellipse(x-s(20),y-s(14),s(7),s(5),-0.3,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(20),y-s(14),s(7),s(5),0.3,0,Math.PI*2);c.fill();
  c.fillStyle='#6d4c41';
  c.beginPath();c.ellipse(x-s(8),y,s(6),s(4),0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(8),y,s(6),s(4),0,0,Math.PI*2);c.fill();
  c.fillStyle='#f0c896';
  c.beginPath();c.arc(x,y-s(42),s(20),0,Math.PI*2);c.fill();
  c.fillStyle='rgba(220,120,100,0.3)';
  c.beginPath();c.ellipse(x-s(13),y-s(37),s(6),s(4),0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(13),y-s(37),s(6),s(4),0,0,Math.PI*2);c.fill();
  c.fillStyle='#ffffff';
  c.beginPath();c.ellipse(x-s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(x+s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.fill();
  c.fillStyle='#111';
  if(angry){
    c.beginPath();c.arc(x-s(7),y-s(43),s(3),0,Math.PI*2);c.fill();
    c.beginPath();c.arc(x+s(7),y-s(43),s(3),0,Math.PI*2);c.fill();
    c.strokeStyle='#333';c.lineWidth=s(2);c.lineCap='round';
    c.beginPath();c.moveTo(x-s(13),y-s(51));c.lineTo(x-s(2),y-s(48));c.stroke();
    c.beginPath();c.moveTo(x+s(13),y-s(51));c.lineTo(x+s(2),y-s(48));c.stroke();
  } else {
    c.beginPath();c.arc(x-s(7),y-s(44),s(2.5),0,Math.PI*2);c.fill();
    c.beginPath();c.arc(x+s(7),y-s(44),s(2.5),0,Math.PI*2);c.fill();
  }
  c.strokeStyle='#888';c.lineWidth=s(0.8);
  c.beginPath();c.ellipse(x-s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.stroke();
  c.beginPath();c.ellipse(x+s(7),y-s(44),s(7),s(8),0,0,Math.PI*2);c.stroke();
  c.strokeStyle='#555';c.lineWidth=s(1.5);c.lineCap='round';
  c.beginPath();c.arc(x,angry?y-s(32):y-s(34),s(5),0.1,Math.PI-0.1);c.stroke();
  c.strokeStyle='rgba(0,0,0,0.15)';c.lineWidth=s(1);
  c.beginPath();c.arc(x,y-s(36),s(10),0.3,Math.PI-0.3);c.stroke();
  c.fillStyle='#1abc9c';
  c.beginPath();c.arc(x,y-s(64),s(19),Math.PI,0);c.fill();
  c.fillRect(x-s(19),y-s(64),s(38),s(6));
  c.fillStyle='#f1c40f';
  c.fillRect(x-s(20),y-s(59),s(40),s(5));
  c.fillStyle='#f1c40f';
  c.beginPath();c.arc(x-s(2),y-s(82),s(5),0,Math.PI*2);c.fill();
  c.beginPath();c.arc(x+s(4),y-s(80),s(4),0,Math.PI*2);c.fill();
  c.beginPath();c.arc(x,y-s(79),s(4),0,Math.PI*2);c.fill();
  if(swing){
    c.strokeStyle=C.stick;c.lineWidth=s(4);c.lineCap='round';
    c.beginPath();c.moveTo(x+s(18),y-s(20));c.lineTo(x+s(52),y-s(60));c.stroke();
    c.fillStyle='#888';c.beginPath();c.arc(x+s(52),y-s(60),s(6),0,Math.PI*2);c.fill();
  }
}

// ─── Title screen ────────────────────────────────────────────────────────────
function drawTitleScreen(){
  const tw=340,th=155;
  tctx.clearRect(0,0,tw,th);
  tctx.fillStyle=C.sky;tctx.fillRect(0,0,tw,th);
  tctx.fillStyle=C.ground;tctx.fillRect(0,th-28,tw,28);
  const runnerX=235,cx2=105;
  const lo=titleFrame===0?7:-7,ao=titleFrame===0?5:-5;
  tctx.strokeStyle=C.rb;tctx.lineWidth=2.5;tctx.lineCap='round';
  tctx.beginPath();tctx.moveTo(runnerX,th-28);tctx.lineTo(runnerX+lo,th-28);tctx.stroke();
  tctx.beginPath();tctx.moveTo(runnerX,th-28);tctx.lineTo(runnerX-lo,th-28);tctx.stroke();
  tctx.beginPath();tctx.moveTo(runnerX,th-28);tctx.lineTo(runnerX,th-46);tctx.stroke();
  tctx.beginPath();tctx.moveTo(runnerX-9,th-37+ao);tctx.lineTo(runnerX+9,th-37-ao);tctx.stroke();
  tctx.fillStyle=C.skin;tctx.beginPath();tctx.arc(runnerX,th-54,9,0,Math.PI*2);tctx.fill();
  tctx.strokeStyle=C.rb;tctx.lineWidth=2;tctx.stroke();
  tctx.fillStyle='#555';tctx.fillRect(runnerX-4,th-57,3,2);tctx.fillRect(runnerX+1,th-57,3,2);
  tctx.font='bold 10px monospace';tctx.textAlign='center';tctx.fillStyle=C.txt;
  tctx.fillText('TYPE NAME',runnerX,th-67);
  drawCartmanOnCtx(tctx,cx2,th-28,0.55,true,true);
  tctx.font='bold 14px monospace';tctx.textAlign='center';tctx.fillStyle=C.bonk;
  tctx.fillText('HIT HIM WITH A STICK',170,18);
}

function animateTitleScreen(){
  titleTimer++;if(titleTimer>14){titleFrame=1-titleFrame;titleTimer=0;}
  drawTitleScreen();
  if(onTitleScreen)requestAnimationFrame(animateTitleScreen);
}

// ─── Game init ───────────────────────────────────────────────────────────────
function startGame(){
  onTitleScreen=false;
  pName=(nameInput.value.trim()||'VICTIM').toUpperCase();
  nameInput.blur();
  ns.style.display='none';gu.style.display='block';
  initGame();gameLoop();
}

function initGame(){
  score=0;combo=0;bgX=0;spd=2.2;shakeT=0;
  bonkTexts=[];particles=[];floaties=[];
  runFrame=0;runTimer=0;hitReact=false;hitT=0;hitAnim=0;
  chaserSwing=false;chaserSwingT=0;gameRunning=true;
  spaceHeld=false;touchHeld=false;gap=170;chaserX=RX-gap;
  isJumping=false;jumpVY=0;jumpY=0;lastTapTime=0;
  runnerBaseX=RX;runnerState='normal';runnerStateTimer=60;
  runnerSpeedMult=1;runnerDucking=false;runnerDuckTimer=0;
  runnerTaunting=false;runnerTauntMsg='';runnerStumble=false;
  sv.textContent='0';cd.style.display='none';os.style.display='none';
}

function isHolding(){return spaceHeld||touchHeld;}

function triggerJump(){
  if(!isJumping&&gameRunning){
    isJumping=true;jumpVY=JUMP_POWER;
  }
}

const TAUNTS=['CAN\'T CATCH ME!','TOO SLOW!','HAHA!','NOPE!','OVER HERE!','MISSED ME!','LOL','EZ'];

function tryBonk(){
  if(!gameRunning)return;
  if(gap>HIT_ZONE){doMiss();return;}
  // Jump bonk while runner is ducking = whiff!
  if(isJumping&&runnerDucking){
    bonkTexts.push({text:'DUCKED!',x:RX,y:GROUND-110,life:0.8,size:28,color:'#9b59b6'});
    bonkTexts.push({text:'whiff...',x:chaserX+20,y:GROUND-80,life:0.6,size:16,color:C.miss});
    combo=0;cd.style.display='none';
    return;
  }
  doBoink();
}

function doBoink(){
  // Distance scoring: closer = more points (1-5 base)
  const closeness=1-Math.max(0,Math.min(1,(gap-MIN_GAP)/(HIT_ZONE-MIN_GAP)));
  let pts=Math.ceil(closeness*5);
  let bonkLabel='BONK!';
  let bonkSize=26;
  let bonkCol='#e24b4a';

  // Jump bonus: 2x multiplier (but risky - can whiff on duck)
  const jumpBonus=isJumping;
  if(jumpBonus)pts*=2;

  // Bonus for hitting during stumble
  const stumbleBonus=runnerStumble;
  if(stumbleBonus)pts+=3;

  if(closeness>0.9){bonkLabel=jumpBonus?'AIR PERFECT!!!':'PERFECT!!';bonkSize=42;bonkCol='#f7c948';}
  else if(closeness>0.7){bonkLabel=jumpBonus?'AIR SMASH!!':'GREAT!';bonkSize=36;bonkCol='#1D9E75';}
  else if(closeness>0.4){bonkLabel=jumpBonus?'JUMP BONK!':'BONK!';bonkSize=30;bonkCol='#BA7517';}
  else {bonkLabel=jumpBonus?'AIR TAP':'bonk';bonkSize=24;bonkCol='#e24b4a';}

  combo++;
  const comboMult=Math.min(combo,5);
  const totalPts=pts*(combo>=2?comboMult:1);
  score+=totalPts;

  bonkTexts.push({text:bonkLabel,x:RX,y:GROUND-100+jumpY,life:1,size:bonkSize,color:bonkCol});
  bonkTexts.push({text:'+'+totalPts,x:RX,y:GROUND-120+jumpY,life:1,size:20,color:'#fff'});
  if(jumpBonus)bonkTexts.push({text:'AERIAL!',x:chaserX+20,y:GROUND-140+jumpY,life:0.8,size:18,color:'#9b59b6'});
  if(stumbleBonus)bonkTexts.push({text:'WHILE DOWN!',x:RX+30,y:GROUND-145+jumpY,life:0.8,size:16,color:'#e67e22'});
  if(combo>=2)bonkTexts.push({text:'x'+comboMult+' COMBO',x:RX-30,y:GROUND-80,life:0.7,size:14,color:'#1D9E75'});
  const cry=FUNNY[Math.floor(Math.random()*FUNNY.length)];
  bonkTexts.push({text:cry,x:RX+20,y:GROUND-135+jumpY,life:1,size:16,color:'#e24b4a',wobble:true});
  spawnParticles(RX,GROUND-50+jumpY);spawnFloaties(RX,GROUND-70+jumpY);
  hitReact=true;hitT=38;hitAnim=(hitAnim+1)%4;
  chaserSwing=true;chaserSwingT=24;shakeT=closeness>0.8?18:12;
  sv.textContent=score;
  if(combo>=2){cd.style.display='block';cv.textContent='x'+comboMult;}
  if(score>best){best=score;bv.textContent=best;}
  spd=Math.min(spd+0.09,6);gap=Math.min(gap+100,220);
  // Interrupt runner states on hit
  runnerState='normal';runnerStateTimer=30;runnerTaunting=false;runnerStumble=false;runnerDucking=false;
}

function doMiss(){
  if(combo>0)bonkTexts.push({text:'too far...',x:chaserX+30,y:GROUND-80,life:0.8,size:14,color:C.miss});
  combo=0;cd.style.display='none';
}

function spawnParticles(x,y){
  for(let i=0;i<14;i++)
    particles.push({x,y,vx:(Math.random()-0.5)*11,vy:-Math.random()*8-2,life:1,size:Math.random()*6+2,col:Math.random()<0.5?'#e24b4a':'#f7c948'});
}
function spawnFloaties(x,y){
  const em=['★','★','💧','💧','💫','✦','~','~'];
  for(let i=0;i<8;i++){
    const a=Math.random()*Math.PI*2;
    floaties.push({x,y:y-10,vx:Math.cos(a)*4+(Math.random()-0.5)*3,vy:Math.sin(a)*4-3,life:1,char:em[i],size:14+Math.random()*8,rot:Math.random()*6});
  }
}

function drawBg(){
  ctx.fillStyle=C.sky;ctx.fillRect(0,0,W,GROUND);
  ctx.fillStyle=C.cloud;
  for(let i=0;i<4;i++){
    const cx2=((i*210-bgX*0.25)%(W+160)+W+160)%(W+160)-80,cy=32+(i%2)*26;
    ctx.beginPath();ctx.ellipse(cx2,cy,38,16,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx2-22,cy+6,26,13,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx2+22,cy+6,26,13,0,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle=C.ground;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle=C.gl;ctx.lineWidth=1;
  for(let i=0;i<22;i++){
    const lx=((i*75-bgX*1.5)%W+W)%W;
    ctx.beginPath();ctx.moveTo(lx,GROUND);ctx.lineTo(lx-18,H);ctx.stroke();
  }
}

function drawRunnerBody(x,y,frame,hitAn){
  const lo=frame===0?9:-9,ao=frame===0?7:-7;
  ctx.strokeStyle=C.rb;ctx.lineWidth=3;ctx.lineCap='round';
  if(hitAn===1){
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-8,y-44);ctx.lineTo(x+18,y-55);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-8,y-44);ctx.lineTo(x-18,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+18,y-8);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-14,y+2);ctx.stroke();
  } else if(hitAn===2){
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+8,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+4,y-46);ctx.lineTo(x+22,y-38);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+4,y-46);ctx.lineTo(x-10,y-40);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-16,y-10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+20,y+2);ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x,y-52);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x-12,y-20+ao);ctx.lineTo(x+12,y-20-ao);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x+lo,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.lineTo(x-lo,y);ctx.stroke();
  }
  ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(x,y-58,11,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=C.rb;ctx.lineWidth=2;ctx.stroke();
  if(hitReact){
    ctx.fillStyle='#111';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText('X X',x,y-55);
  } else {
    ctx.fillStyle='#555';ctx.fillRect(x-5,y-61,4,3);ctx.fillRect(x+1,y-61,4,3);
  }
}

function drawProxBar(){
  const bW=180,bH=10,bx=W/2-90,by=14;
  const pct=Math.max(0,Math.min(1,(200-gap)/(200-MIN_GAP)));
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.beginPath();ctx.roundRect(bx,by,bW,bH,5);ctx.fill();
  const inRange=gap<=HIT_ZONE;
  ctx.fillStyle=inRange?C.bonk:C.spbar;
  ctx.beginPath();ctx.roundRect(bx,by,bW*pct,bH,5);ctx.fill();
  ctx.font='9px monospace';ctx.textAlign='center';
  ctx.fillStyle=inRange?C.bonk:C.muted;
  let label='HOLD TO SPRINT';
  if(isJumping&&inRange)label=runnerDucking?'THEY DUCKED! DON\'T JUMP!':'RELEASE FOR AIR BONK!';
  else if(inRange)label='RELEASE TO BONK!';
  else if(isJumping)label='JUMPING...';
  else if(runnerTaunting)label='THEY\'RE TAUNTING! GO!';
  else if(runnerStumble)label='THEY STUMBLED! NOW!';
  ctx.fillText(label,W/2,by+bH+13);
}

function updateParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.life-=0.045;
    ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.size,p.size);
  });
  ctx.globalAlpha=1;
}
function updateFloaties(){
  floaties=floaties.filter(f=>f.life>0);
  floaties.forEach(f=>{
    f.x+=f.vx;f.y+=f.vy;f.vy+=0.15;f.life-=0.03;f.rot+=0.1;
    ctx.globalAlpha=f.life;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
    ctx.font=`${f.size}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=f.char==='★'||f.char==='✦'?C.star:C.tear;
    ctx.fillText(f.char,0,0);ctx.restore();
  });
  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
}
function updateBonkTexts(){
  bonkTexts=bonkTexts.filter(b=>b.life>0);
  bonkTexts.forEach(b=>{
    b.y-=1.8;b.life-=0.022;
    ctx.globalAlpha=b.life;
    const wx=b.wobble?Math.sin(b.life*30)*3:0;
    ctx.font=`bold ${b.size}px monospace`;ctx.textAlign='center';
    ctx.fillStyle=b.color;ctx.fillText(b.text,b.x+wx,b.y);
  });
  ctx.globalAlpha=1;
}

function updateRunnerAI(){
  const difficulty=Math.min(score*0.02,1); // 0-1 scaling with score
  runnerStateTimer--;

  if(runnerStateTimer<=0){
    // Pick new state based on gap
    const r=Math.random();
    if(gap<100){
      // Close: panic sprint or duck
      if(r<0.5+difficulty*0.2){
        runnerState='panic';runnerStateTimer=30+Math.floor(Math.random()*30);
        runnerSpeedMult=2+difficulty;
        bonkTexts.push({text:'?!',x:RX,y:GROUND-105,life:0.5,size:22,color:'#e24b4a'});
      } else if(r<0.7+difficulty*0.15){
        runnerState='duck';runnerStateTimer=20+Math.floor(Math.random()*20);
        runnerDucking=true;runnerSpeedMult=0.3;
        bonkTexts.push({text:'*ducks*',x:RX,y:GROUND-90,life:0.5,size:14,color:'#9b59b6'});
      } else {
        runnerState='normal';runnerStateTimer=20+Math.floor(Math.random()*30);
        runnerSpeedMult=1+Math.random()*0.5;
      }
    } else if(gap>160){
      // Far: taunt or stumble
      if(r<0.35){
        runnerState='taunt';runnerStateTimer=50+Math.floor(Math.random()*40);
        runnerTaunting=true;runnerSpeedMult=0.2;
        runnerTauntMsg=TAUNTS[Math.floor(Math.random()*TAUNTS.length)];
        bonkTexts.push({text:runnerTauntMsg,x:RX,y:GROUND-105,life:0.8,size:16,color:'#3498db',wobble:true});
      } else if(r<0.5-difficulty*0.1){
        runnerState='stumble';runnerStateTimer=25+Math.floor(Math.random()*15);
        runnerStumble=true;runnerSpeedMult=0.05;
        bonkTexts.push({text:'*stumbles*',x:RX,y:GROUND-90,life:0.6,size:16,color:'#e67e22'});
      } else {
        runnerState='normal';runnerStateTimer=30+Math.floor(Math.random()*40);
        runnerSpeedMult=0.8+Math.random()*0.6;
      }
    } else {
      // Mid range: variable speed
      runnerState='normal';runnerStateTimer=20+Math.floor(Math.random()*30);
      runnerSpeedMult=0.6+Math.random()*1.0;
      // Occasional random speed burst
      if(r<0.15+difficulty*0.1){
        runnerSpeedMult=1.8+difficulty*0.5;
        bonkTexts.push({text:'!',x:RX,y:GROUND-100,life:0.4,size:18,color:'#f7c948'});
      }
    }
  }

  // End duck/taunt/stumble when timer expires
  if(runnerStateTimer<=3){
    runnerDucking=false;runnerTaunting=false;runnerStumble=false;
  }

  // Runner speed affects gap: runner pulls away based on their speed multiplier
  const runnerPull=runnerSpeedMult*0.4;
  gap+=runnerPull;
}

function gameLoop(){
  if(!gameRunning)return;
  bgX+=spd;

  // Cartman sprint: hold to close gap
  if(isHolding()){gap-=(5.5+spd*0.5);}else{gap+=0.3+spd*0.1;}

  // Runner AI
  updateRunnerAI();

  gap=Math.max(MIN_GAP,Math.min(280,gap));
  chaserX=RX-gap;

  // Jump physics
  if(isJumping){
    jumpY+=jumpVY;jumpVY+=GRAVITY;
    if(jumpY>=0){jumpY=0;jumpVY=0;isJumping=false;}
  }

  runTimer++;
  const animSpd=runnerStumble?30:(runnerTaunting?20:(isHolding()?7:13));
  if(runTimer>animSpd){runFrame=1-runFrame;runTimer=0;}
  if(hitT>0)hitT--;if(hitT===0){hitReact=false;}
  if(chaserSwingT>0)chaserSwingT--;if(chaserSwingT===0)chaserSwing=false;
  if(shakeT>0)shakeT--;

  ctx.save();
  if(shakeT>0)ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*5);
  ctx.clearRect(0,0,W,H);
  drawBg();drawProxBar();
  updateParticles();updateFloaties();

  // Draw runner
  const rx=RX+(hitReact?14:0);
  const ry=GROUND;
  const duckOffset=runnerDucking?12:0;

  ctx.font='bold 13px monospace';ctx.textAlign='center';
  ctx.fillStyle=hitReact?C.bonk:(runnerTaunting?'#3498db':(runnerStumble?'#e67e22':C.txt));
  ctx.fillText(pName.toUpperCase(),rx,ry-88+duckOffset);

  if(runnerDucking){
    // Draw ducking runner (crouched)
    ctx.strokeStyle=C.rb;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(rx-10,ry);ctx.lineTo(rx+10,ry);ctx.stroke(); // legs spread
    ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx,ry-20);ctx.stroke(); // short body
    ctx.beginPath();ctx.moveTo(rx-10,ry-15);ctx.lineTo(rx+10,ry-15);ctx.stroke(); // arms out
    ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(rx,ry-28,9,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=C.rb;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#555';ctx.fillRect(rx-4,ry-31,3,2);ctx.fillRect(rx+1,ry-31,3,2);
  } else if(runnerStumble){
    // Draw stumbling runner (falling forward)
    ctx.strokeStyle=C.rb;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(rx-5,ry);ctx.lineTo(rx+15,ry-25);ctx.stroke(); // leaning body
    ctx.beginPath();ctx.moveTo(rx+10,ry-18);ctx.lineTo(rx+25,ry-10);ctx.stroke(); // arm out
    ctx.beginPath();ctx.moveTo(rx+10,ry-18);ctx.lineTo(rx-5,ry-25);ctx.stroke(); // other arm
    ctx.beginPath();ctx.moveTo(rx-5,ry);ctx.lineTo(rx-12,ry+2);ctx.stroke(); // back leg
    ctx.beginPath();ctx.moveTo(rx-5,ry);ctx.lineTo(rx+8,ry+2);ctx.stroke(); // front leg
    ctx.fillStyle=C.skin;ctx.beginPath();ctx.arc(rx+18,ry-32,9,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=C.rb;ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#555';ctx.fillRect(rx+15,ry-35,3,2);ctx.fillRect(rx+20,ry-35,3,2);
  } else if(runnerTaunting){
    // Draw taunting runner (looking back)
    drawRunnerBody(rx,ry,runFrame,0);
    // Draw look-back indicator
    ctx.fillStyle='#555';
    ctx.fillRect(rx-7,ry-61,4,3);ctx.fillRect(rx-2,ry-61,4,3); // eyes looking left (at Cartman)
  } else {
    drawRunnerBody(rx,ry,runFrame,hitReact?hitAnim:0);
  }

  // Draw Cartman (chaser) with jump offset
  const chaserY=GROUND+jumpY;
  drawCartmanOnCtx(ctx,chaserX,chaserY,1,chaserSwing,chaserSwing);

  // Jump shadow when airborne
  if(isJumping){
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.beginPath();ctx.ellipse(chaserX,GROUND+2,22,6,0,0,Math.PI*2);ctx.fill();
  }

  // Range indicator line
  if(gap<=HIT_ZONE+12&&gap>0){
    const a=Math.max(0,1-(gap-MIN_GAP)/(HIT_ZONE-MIN_GAP+12));
    ctx.strokeStyle=`rgba(226,75,74,${a*0.45})`;ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(chaserX+22,chaserY-55);ctx.lineTo(rx-16,ry-55+duckOffset);ctx.stroke();
    ctx.setLineDash([]);
  }

  // Duck warning icon when ducking and in range
  if(runnerDucking&&gap<HIT_ZONE+30){
    ctx.font='bold 14px monospace';ctx.textAlign='center';
    ctx.fillStyle='#9b59b6';
    ctx.fillText('DUCKING!',RX,GROUND-45);
  }

  updateBonkTexts();ctx.restore();
  animId=requestAnimationFrame(gameLoop);
}

// Double-tap detection helper
function handlePress(){
  const now=Date.now();
  if(now-lastTapTime<DOUBLE_TAP_MS){
    triggerJump();
    lastTapTime=0; // reset so triple tap doesn't re-trigger
  } else {
    lastTapTime=now;
  }
}

// Keyboard controls
document.addEventListener('keydown',e=>{
  if(onTitleScreen){
    if(e.key==='Enter')startGame();
    return;
  }
  if(e.code==='Space'){
    e.preventDefault();
    if(!spaceHeld)handlePress(); // detect double-tap on press
    spaceHeld=true;
  }
  if(e.code==='Enter'&&!gameRunning)rb.click();
});
document.addEventListener('keyup',e=>{
  if(!onTitleScreen&&e.code==='Space'){spaceHeld=false;if(gameRunning)tryBonk();}
});

// Mouse controls (game canvas)
canvas.addEventListener('mousedown',()=>{handlePress();touchHeld=true;});
canvas.addEventListener('mouseup',()=>{touchHeld=false;if(gameRunning)tryBonk();});

// Touch controls - whole document for mobile
document.addEventListener('touchstart',e=>{
  if(onTitleScreen)return;
  if(!gameRunning){rb.click();e.preventDefault();return;}
  e.preventDefault();handlePress();touchHeld=true;
},{passive:false});
document.addEventListener('touchend',e=>{
  if(onTitleScreen)return;
  e.preventDefault();touchHeld=false;if(gameRunning)tryBonk();
},{passive:false});
sb.addEventListener('click',startGame);
rb.addEventListener('click',()=>{gameRunning=false;initGame();gameLoop();});

animateTitleScreen();
</script>
